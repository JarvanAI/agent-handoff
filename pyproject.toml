[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-handoff"
version = "0.2.0"
description = "Universal Multi-Agent Handoff Protocol, Trajectory Distillation, and Session Search Engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Shenzhou Zhao", email = "jarvanjasonzhao@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
vector = ["sqlite-vec>=0.1.3"]

[project.scripts]
session = "agent_handoff.cli:session_main"
session-handoff = "agent_handoff.cli:handoff_main"
session-distill = "agent_handoff.cli:distill_main"
session-continue = "agent_handoff.cli:continue_main"
session-search = "agent_handoff.cli:search_main"
agent-handoff = "agent_handoff.cli:main"
handoff = "agent_handoff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/JasonJarvan/handoff"
Repository = "https://github.com/JasonJarvan/handoff"
