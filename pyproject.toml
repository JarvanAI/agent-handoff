[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff"
version = "0.1.0"
description = "Universal Multi-Agent Handoff Protocol & Trajectory Distillation Engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Shenzhou Zhao", email = "jarvanjasonzhao@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
handoff = "handoff.cli:main"
session-distill = "handoff.cli:main"

[project.urls]
Homepage = "https://github.com/JasonJarvan/handoff"
Repository = "https://github.com/JasonJarvan/handoff"
